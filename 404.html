<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページがないよ｜こすくまくんのおみせ</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: var(--font-body); color: var(--ink); background: var(--paper);
    padding: var(--space-4); text-align: center;
  }
  main { display: grid; justify-items: center; gap: var(--space-3); max-width: 420px; }
  img { width: clamp(140px, 40vw, 220px); }
  h1 { font-size: var(--fs-h2); word-break: keep-all; line-break: strict; overflow-wrap: break-word; text-wrap: balance; }
  p { color: var(--ink-sub); line-break: strict; overflow-wrap: break-word; text-wrap: pretty; }
  /* 句読点単位でしか折り返さないインラインブロック（main.css非読込のためここでも定義） */
  .u-ib { display: inline-block; }
  /* §6-2 Secondary（Primaryは「カートに入れる」「レジにすすむ」専用のためここでは使わない） */
  a.btn {
    display: inline-flex; align-items: center; justify-content: center;
    margin-top: var(--space-2); min-height: 44px;
    border: 2px solid var(--ink); border-radius: var(--radius-m);
    background: var(--surface); color: var(--ink); font-weight: 700;
    padding: var(--space-2) var(--space-4); text-decoration: none;
  }
  a.btn:active { transform: translateY(2px); }
  /* フォーカス可視化（§8-2） */
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/assets/pose/lost.webp" alt="地図を持って道に迷っているこすくまくん">
  <h1>そのページ、ないよ</h1>
  <p>ぼくもさっき探した。なかった。<br><span class="u-ib">ページを探す旅に出たまま、</span><span class="u-ib">ぼくもまだ戻ってないよ</span></p>
  <a class="btn" href="/">おみせに戻る</a>
</main>
</body>
</html>
